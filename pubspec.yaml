name: setkeep
description: "SETKEEP - トレーニングの記録を次の成長につなげるアプリ。"
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  app_links: ^7.2.1
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  interactive_3d:
    path: packages/interactive_3d
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.2
  video_player: ^2.14.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2
  video_player_platform_interface: ^6.9.0
  image_picker_platform_interface: ^2.11.1

flutter:
  uses-material-design: true
  assets:
    - android/app/src/main/res/drawable-xxxhdpi/launch_logo.png
    - ios/Runner/Assets.xcassets/LaunchImage.imageset/LaunchImage@3x.png
    - assets/brand/setkeep_splash_mark.png
    - assets/brand/setkeep_share_lockup.png
    - assets/brand/setkeep_splash_lockup_source.png
    - assets/vital_videos/
    - assets/vital_thumbnails/
    - assets/models/body_tab.glb
    - assets/category_muscles/
    - assets/sounds/rest_complete.wav
